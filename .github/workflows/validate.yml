name: Azure Infrastructure Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BICEP_VERSION: 'v0.49.2'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version "$BICEP_VERSION"
          VERSION=$(az bicep version)
          EXPECTED="${BICEP_VERSION#v}"
          [[ "$VERSION" == "Bicep CLI version $EXPECTED "* ]]

      - name: Strict infrastructure validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation

          strict_check() {
            local output
            if ! output=$("$@" 2>&1); then
              printf '%s\n' "$output"
              return 1
            fi
            printf '%s\n' "$output"
            if grep -Eiq '\bwarning\b' <<< "$output"; then
              echo "Compiler warning detected."
              return 1
            fi
          }

          mapfile -d '' templates < <(
            find infrastructure -type f -name '*.bicep' -print0
          )

          mapfile -d '' parameters < <(
            find infrastructure -type f -name '*.bicepparam' -print0
          )

          [[ ${#templates[@]} -eq 7 ]]
          [[ ${#parameters[@]} -eq 3 ]]

          for file in "${templates[@]}"; do
            echo "Validating $file"
            output="${file//\//_}.generated.json"

            strict_check az bicep lint --file "$file"

            strict_check az bicep build \
              --file "$file" \
              --outfile ".validation/$output"

            test -s ".validation/$output"
          done

          for file in "${parameters[@]}"; do
            echo "Validating $file"
            output="${file//\//_}.generated.json"

            strict_check az bicep build-params \
              --file "$file" \
              --outfile ".validation/$output"

            test -s ".validation/$output"
          done

          {
            echo "### Infrastructure validation"
            echo "- Bicep templates: 7/7 passed"
            echo "- Parameter files: 3/3 passed"
            echo "- Compiler warnings: 0"
            echo "- Azure deployment: none"
          } >> "$GITHUB_STEP_SUMMARY"